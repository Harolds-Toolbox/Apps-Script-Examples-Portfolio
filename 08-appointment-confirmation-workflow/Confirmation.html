<!doctype html>
<html>
  <head>
    <base target="_top" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body {
        font: 16px system-ui;
        max-width: 560px;
        margin: 48px auto;
        padding: 0 20px;
        color: #17202a;
      }
      button {
        padding: 12px 18px;
        margin: 6px;
        border: 0;
        border-radius: 6px;
        background: #1769aa;
        color: white;
      }
      button.cancel {
        background: #667085;
      }
      #message {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Appointment response</h1>
    <p>Choose one option. This secure link can only be used once.</p>
    <button onclick="respond('Confirmed')">Confirm</button
    ><button class="cancel" onclick="respond('Cancelled')">Cancel</button>
    <div id="message"></div>
    <script>
      const token = <?!= JSON.stringify(token) ?>;

      function setButtonsDisabled(disabled) {
        document.querySelectorAll("button").forEach(function (button) {
          button.disabled = disabled;
        });
      }

      function respond(value) {
        setButtonsDisabled(true);
        google.script.run
          .withSuccessHandler(function (result) {
            document.getElementById("message").textContent = result.message;
          })
          .withFailureHandler(function (error) {
            document.getElementById("message").textContent = error.message;
            setButtonsDisabled(false);
          })
          .submitAppointmentResponse(token, value);
      }
    </script>
  </body>
</html>
