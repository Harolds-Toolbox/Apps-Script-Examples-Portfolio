<!doctype html>
<html lang="en">
  <head>
    <base target="_top">
    <style>
      :root { --ink:#17202a; --muted:#667085; --line:#d0d5dd; --accent:#175cd3; --bg:#f5f7fa; --ok:#067647; --error:#b42318; font-family:Arial,sans-serif; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; background:linear-gradient(135deg,#eef4ff,var(--bg)); color:var(--ink); }
      main { width:min(960px,calc(100% - 32px)); margin:32px auto; display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:24px; }
      .panel { background:#fff; border:1px solid var(--line); border-radius:16px; padding:24px; box-shadow:0 18px 50px rgba(16,24,40,.08); }
      h1 { margin:0 0 6px; font-size:28px; }
      .intro { margin:0 0 22px; color:var(--muted); }
      .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
      label { display:grid; gap:6px; font-size:13px; font-weight:700; }
      label.full { grid-column:1/-1; }
      input,textarea { width:100%; border:1px solid var(--line); border-radius:8px; padding:11px 12px; font:inherit; }
      textarea { min-height:100px; resize:vertical; }
      input:focus,textarea:focus { outline:3px solid rgba(23,92,211,.16); border-color:var(--accent); }
      button { margin-top:20px; min-height:46px; width:100%; border:0; border-radius:9px; background:var(--accent); color:#fff; font-weight:800; cursor:pointer; }
      button:disabled { opacity:.55; cursor:wait; }
      #status { min-height:22px; margin-top:12px; color:var(--muted); }
      #status.error { color:var(--error); } #status.success { color:var(--ok); }
      aside h2 { margin-top:0; font-size:17px; }
      aside ol { padding-left:20px; color:var(--muted); }
      @media(max-width:760px){ main{grid-template-columns:1fr}.grid{grid-template-columns:1fr}label.full{grid-column:auto} }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <h1>Document generator</h1>
        <p class="intro">Complete the form to create a PDF from a Google Docs template.</p>
        <form id="form">
          <div class="grid">
            <label>Reference<input id="reference" maxlength="40" placeholder="REQ-1042" required></label>
            <label>Start date<input id="startDate" type="date" required></label>
            <label class="full">Customer name<input id="customerName" maxlength="120" required></label>
            <label class="full">Customer address<textarea id="customerAddress" maxlength="500" required></textarea></label>
            <label class="full">Project title<input id="projectTitle" maxlength="160" required></label>
            <label>Total<input id="total" type="number" min="0" step="0.01" required></label>
            <label class="full">Notes<textarea id="notes" maxlength="2000"></textarea></label>
          </div>
          <button id="generate" type="submit">Generate PDF</button>
          <div id="status" role="status"></div>
        </form>
      </section>
      <aside class="panel">
        <h2>What happens next</h2>
        <ol><li>Your input is validated.</li><li>A temporary template copy is populated.</li><li>The copy is converted to PDF.</li><li>The browser downloads it.</li><li>The temporary document is moved to Trash.</li></ol>
      </aside>
    </main>
    <script>
      const form = document.getElementById('form');
      const button = document.getElementById('generate');
      const status = document.getElementById('status');
      function setStatus(text, type) { status.textContent = text; status.className = type || ''; }
      function download(result) {
        const link = document.createElement('a');
        link.href = 'data:' + result.mimeType + ';base64,' + result.base64;
        link.download = result.fileName;
        document.body.appendChild(link); link.click(); link.remove();
      }
      form.addEventListener('submit', function (event) {
        event.preventDefault(); button.disabled = true; setStatus('Generating…');
        const input = ['reference','customerName','customerAddress','projectTitle','startDate','total','notes']
          .reduce(function (value, id) { value[id] = document.getElementById(id).value; return value; }, {});
        google.script.run.withSuccessHandler(function (result) {
          download(result); button.disabled = false; setStatus('PDF generated successfully.', 'success');
        }).withFailureHandler(function (error) {
          button.disabled = false; setStatus(error && error.message ? error.message : 'Generation failed.', 'error');
        }).generateDocumentPdf(input);
      });
    </script>
  </body>
</html>
