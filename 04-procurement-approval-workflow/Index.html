<!doctype html>
<html lang="en">
  <head>
    <base target="_top" />
    <style>
      :root {
        --ink: #182230;
        --muted: #667085;
        --line: #d0d5dd;
        --accent: #175cd3;
        --green: #067647;
        --red: #b42318;
        --amber: #b54708;
        font-family: Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f5f7fa;
        color: var(--ink);
      }
      header {
        padding: 24px max(24px, calc((100% - 1120px) / 2));
        background: #101828;
        color: #fff;
      }
      header h1 {
        margin: 0;
        font-size: 24px;
      }
      main {
        max-width: 1120px;
        margin: 28px auto;
        padding: 0 24px;
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 24px;
      }
      .panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 20px;
      }
      h2 {
        margin: 0 0 16px;
        font-size: 18px;
      }
      label {
        display: grid;
        gap: 5px;
        margin: 12px 0;
        font-size: 13px;
        font-weight: 700;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        font: inherit;
      }
      textarea {
        min-height: 100px;
        resize: vertical;
      }
      button {
        border: 0;
        border-radius: 7px;
        padding: 9px 12px;
        font-weight: 800;
        cursor: pointer;
      }
      .primary {
        width: 100%;
        margin-top: 8px;
        background: var(--accent);
        color: #fff;
      }
      .approve {
        background: var(--green);
        color: #fff;
      }
      .reject {
        background: var(--red);
        color: #fff;
      }
      .info {
        background: #fff3e8;
        color: var(--amber);
      }
      .request {
        padding: 15px;
        border: 1px solid var(--line);
        border-radius: 10px;
        margin: 12px 0;
      }
      .top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .meta {
        color: var(--muted);
        font-size: 13px;
      }
      .status {
        font-size: 12px;
        font-weight: 900;
      }
      .actions {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      #message {
        min-height: 22px;
        margin-top: 10px;
        color: var(--muted);
      }
      @media (max-width: 780px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header><h1>Procurement workflow</h1></header>
    <main>
      <section class="panel">
        <h2>New request</h2>
        <form id="form">
          <label>Supplier<input id="supplier" maxlength="160" required /></label
          ><label
            >Description<textarea
              id="description"
              maxlength="2000"
              required
            ></textarea></label
          ><label
            >Currency<select id="currency">
              <option>GBP</option>
              <option>EUR</option>
              <option>USD</option>
            </select></label
          ><label
            >Amount<input
              id="amount"
              type="number"
              min="0.01"
              step="0.01"
              required /></label
          ><button class="primary">Submit request</button>
        </form>
        <div id="message"></div>
      </section>
      <section class="panel">
        <div class="top">
          <h2>Requests</h2>
          <button id="refresh" type="button">Refresh</button>
        </div>
        <div id="requests">Loading…</div>
      </section>
    </main>
    <script>
      let reviewer = false;
      const list = document.getElementById("requests"),
        message = document.getElementById("message");
      function esc(value) {
        const n = document.createElement("span");
        n.textContent = value == null ? "" : String(value);
        return n.innerHTML;
      }
      function render(items) {
        list.innerHTML = items.length
          ? items
              .map(function (r) {
                let actions = "";
                if (reviewer && r.status === "PENDING")
                  actions =
                    '<div class="actions"><button class="approve" data-action="APPROVE" data-ref="' +
                    esc(r.reference) +
                    '">Approve</button><button class="reject" data-action="REJECT" data-ref="' +
                    esc(r.reference) +
                    '">Reject</button><button class="info" data-action="REQUEST_INFORMATION" data-ref="' +
                    esc(r.reference) +
                    '">Request information</button></div>';
                if (!reviewer && r.status === "NEEDS_INFORMATION")
                  actions =
                    '<div class="actions"><button class="info" data-action="RESPOND_INFORMATION" data-ref="' +
                    esc(r.reference) +
                    '">Respond</button></div>';
                return (
                  '<article class="request"><div class="top"><strong>' +
                  esc(r.supplier) +
                  '</strong><span class="status">' +
                  esc(r.status) +
                  "</span></div><p>" +
                  esc(r.description) +
                  '</p><div class="meta">' +
                  esc(r.reference) +
                  " · " +
                  esc(r.currency) +
                  " " +
                  Number(r.amount).toFixed(2) +
                  "</div>" +
                  actions +
                  "</article>"
                );
              })
              .join("")
          : "No requests to show.";
      }
      function refresh() {
        google.script.run
          .withSuccessHandler(render)
          .withFailureHandler(fail)
          .refreshProcurementRequests();
      }
      function fail(e) {
        message.textContent =
          e && e.message ? e.message : "Something went wrong.";
      }
      document.getElementById("form").addEventListener("submit", function (e) {
        e.preventDefault();
        message.textContent = "Submitting…";
        google.script.run
          .withSuccessHandler(function () {
            e.target.reset();
            message.textContent = "Request submitted.";
            refresh();
          })
          .withFailureHandler(fail)
          .submitProcurementRequest({
            supplier: document.getElementById("supplier").value,
            description: document.getElementById("description").value,
            currency: document.getElementById("currency").value,
            amount: document.getElementById("amount").value,
          });
      });
      list.addEventListener("click", function (e) {
        const b = e.target.closest("[data-action]");
        if (!b) return;
        let text = "";
        if (b.dataset.action.indexOf("INFORMATION") !== -1) {
          text =
            prompt(
              b.dataset.action === "REQUEST_INFORMATION"
                ? "What information is required?"
                : "Enter your response:",
            ) || "";
          if (!text) return;
        }
        b.disabled = true;
        google.script.run
          .withSuccessHandler(refresh)
          .withFailureHandler(fail)
          .performProcurementAction({
            reference: b.dataset.ref,
            action: b.dataset.action,
            message: text,
          });
      });
      document.getElementById("refresh").addEventListener("click", refresh);
      google.script.run
        .withSuccessHandler(function (data) {
          reviewer = data.reviewer;
          render(data.requests);
        })
        .withFailureHandler(fail)
        .getProcurementBootstrap();
    </script>
  </body>
</html>
