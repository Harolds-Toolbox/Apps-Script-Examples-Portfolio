<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
      :root { color-scheme: light; --ink:#17202a; --muted:#667085; --line:#d0d5dd; --accent:#155eef; --surface:#fff; --bg:#f5f7fa; }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 Arial,sans-serif; }
      header { background:#101828; color:#fff; padding:22px max(24px,calc((100% - 1050px)/2)); }
      header h1 { margin:0; font-size:22px; }
      main { max-width:1050px; margin:28px auto; padding:0 24px; display:grid; grid-template-columns:340px 1fr; gap:24px; }
      section { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px; }
      h2 { margin:0 0 16px; font-size:18px; }
      label { display:block; margin:12px 0 5px; font-weight:600; }
      input,textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:7px; font:inherit; }
      textarea { min-height:120px; resize:vertical; }
      button { border:0; border-radius:7px; padding:10px 14px; font-weight:700; cursor:pointer; }
      button.primary { width:100%; margin-top:16px; background:var(--accent); color:#fff; }
      button.approve { background:#067647; color:#fff; }
      button.reject { background:#b42318; color:#fff; }
      button:disabled { opacity:.55; cursor:wait; }
      .card { border:1px solid var(--line); border-radius:9px; padding:14px; margin:12px 0; }
      .card-top { display:flex; justify-content:space-between; gap:16px; }
      .meta { color:var(--muted); font-size:13px; }
      .status { font-size:12px; font-weight:700; letter-spacing:.04em; }
      .actions { display:flex; gap:8px; margin-top:12px; }
      #message { min-height:24px; margin-top:12px; color:var(--muted); }
      @media (max-width:760px) { main { grid-template-columns:1fr; } }
    </style>
  </head>
  <body>
    <header><h1>Request portal</h1></header>
    <main>
      <section>
        <h2>New request</h2>
        <form id="request-form">
          <label for="title">Title</label><input id="title" maxlength="120" required>
          <label for="amount">Amount</label><input id="amount" type="number" min="0" step="0.01" required>
          <label for="details">Details</label><textarea id="details" maxlength="4000" required></textarea>
          <button class="primary" type="submit">Submit request</button>
        </form>
        <div id="message" role="status"></div>
      </section>
      <section>
        <div class="card-top"><h2>Requests</h2><button id="refresh" type="button">Refresh</button></div>
        <div id="requests">Loading…</div>
      </section>
    </main>
    <script>
      let reviewer = false;
      const form = document.getElementById('request-form');
      const message = document.getElementById('message');
      const requestList = document.getElementById('requests');

      function escapeHtml(value) {
        const node = document.createElement('div');
        node.textContent = value == null ? '' : String(value);
        return node.innerHTML;
      }

      function renderRequests(requests) {
        if (!requests.length) { requestList.textContent = 'No requests to show.'; return; }
        requestList.innerHTML = requests.map(function (item) {
          const actions = reviewer && item.status === 'PENDING' ?
            '<div class="actions"><button class="approve" data-ref="' + escapeHtml(item.reference) + '" data-decision="APPROVED">Approve</button>' +
            '<button class="reject" data-ref="' + escapeHtml(item.reference) + '" data-decision="REJECTED">Reject</button></div>' : '';
          return '<article class="card"><div class="card-top"><strong>' + escapeHtml(item.title) + '</strong>' +
            '<span class="status">' + escapeHtml(item.status) + '</span></div>' +
            '<div class="meta">' + escapeHtml(item.reference) + ' · ' + Number(item.amount).toFixed(2) + '</div>' +
            '<p>' + escapeHtml(item.details) + '</p>' + actions + '</article>';
        }).join('');
      }

      function showError(error) { message.textContent = error && error.message ? error.message : 'Something went wrong.'; }
      function refresh() { google.script.run.withSuccessHandler(renderRequests).withFailureHandler(showError).refreshPortalRequests(); }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        const button = form.querySelector('button');
        button.disabled = true;
        message.textContent = 'Submitting…';
        google.script.run.withSuccessHandler(function () {
          form.reset(); message.textContent = 'Request submitted.'; button.disabled = false; refresh();
        }).withFailureHandler(function (error) { button.disabled = false; showError(error); }).submitPortalRequest({
          title: document.getElementById('title').value,
          amount: document.getElementById('amount').value,
          details: document.getElementById('details').value
        });
      });

      requestList.addEventListener('click', function (event) {
        const button = event.target.closest('[data-decision]');
        if (!button) return;
        button.disabled = true;
        google.script.run.withSuccessHandler(refresh).withFailureHandler(showError).decidePortalRequest({
          reference: button.dataset.ref, decision: button.dataset.decision
        });
      });
      document.getElementById('refresh').addEventListener('click', refresh);
      google.script.run.withSuccessHandler(function (data) {
        reviewer = data.reviewer; renderRequests(data.requests);
      }).withFailureHandler(showError).getPortalBootstrap();
    </script>
  </body>
</html>
