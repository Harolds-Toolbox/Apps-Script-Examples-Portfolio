<!doctype html>
<html lang="en">
  <head>
    <base target="_top" />
    <style>
      :root {
        --ink: #15221b;
        --muted: #66736c;
        --green: #16704a;
        --soft: #eaf6ef;
        --red: #b42318;
        --line: #d6e1da;
        --bg: #f3f7f4;
        font-family: Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 50% -10%, #fff 0, transparent 42%),
          var(--bg);
        color: var(--ink);
      }
      main {
        width: min(1160px, calc(100% - 32px));
        margin: 42px auto 70px;
      }
      header {
        text-align: center;
        margin-bottom: 32px;
      }
      h1 {
        margin: 0;
        font-size: clamp(28px, 5vw, 44px);
      }
      .subhead {
        margin: 8px 0 0;
        color: var(--muted);
      }
      .toolbar {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
        color: var(--muted);
        font-size: 13px;
      }
      button {
        border: 1px solid #aebfb4;
        border-radius: 999px;
        background: #fff;
        color: var(--green);
        padding: 8px 13px;
        font-weight: 800;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 18px;
      }
      .card,
      .table-panel {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid var(--line);
        box-shadow: 0 16px 45px rgba(26, 68, 44, 0.07);
      }
      .card {
        border-radius: 18px;
        padding: 24px;
        text-align: center;
      }
      .label {
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .value {
        margin-top: 14px;
        font-size: clamp(28px, 4vw, 42px);
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .value.good {
        color: var(--green);
      }
      .value.bad {
        color: var(--red);
      }
      .table-panel {
        margin-top: 24px;
        border-radius: 18px;
        overflow: hidden;
      }
      .table-title {
        padding: 20px 22px;
        border-bottom: 1px solid var(--line);
        font-weight: 800;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 14px 18px;
        text-align: left;
        border-bottom: 1px solid var(--line);
      }
      th {
        background: #f8faf9;
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
      }
      td.number {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .site {
        font-weight: 800;
      }
      .positive {
        color: var(--green);
      }
      .negative {
        color: var(--red);
      }
      #state {
        padding: 50px;
        text-align: center;
        color: var(--muted);
      }
      .error {
        color: var(--red) !important;
      }
      @media (max-width: 820px) {
        .cards {
          grid-template-columns: 1fr 1fr;
        }
        .table-panel {
          overflow: auto;
        }
      }
      @media (max-width: 500px) {
        .cards {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Operations dashboard</h1>
        <p class="subhead" id="date">Loading daily reconciliation…</p>
        <div class="toolbar">
          <span id="refreshed"></span><button id="refresh">Refresh</button>
        </div>
      </header>
      <section id="content" hidden>
        <div class="cards">
          <article class="card">
            <div class="label">Expected</div>
            <div class="value" id="expected">0</div>
          </article>
          <article class="card">
            <div class="label">Actual</div>
            <div class="value" id="actual">0</div>
          </article>
          <article class="card">
            <div class="label">Variance</div>
            <div class="value" id="variance">0</div>
          </article>
          <article class="card">
            <div class="label">Operational quantity</div>
            <div class="value" id="quantity">0</div>
          </article>
        </div>
        <section class="table-panel">
          <div class="table-title">Site reconciliation</div>
          <table>
            <thead>
              <tr>
                <th>Site</th>
                <th>Expected</th>
                <th>Actual</th>
                <th>Variance</th>
                <th>Quantity</th>
                <th>Captured</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </section>
      </section>
      <div id="state">Loading…</div>
    </main>
    <script>
      const state = document.getElementById("state"),
        content = document.getElementById("content"),
        refresh = document.getElementById("refresh");
      function text(id, value) {
        document.getElementById(id).textContent = value;
      }
      function number(value) {
        return Number(value || 0).toLocaleString(undefined, {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      }
      function escapeHtml(value) {
        const node = document.createElement("span");
        node.textContent = value == null ? "" : String(value);
        return node.innerHTML;
      }
      function load() {
        refresh.disabled = true;
        state.hidden = false;
        state.className = "";
        state.textContent = "Loading…";
        google.script.run
          .withSuccessHandler(render)
          .withFailureHandler(fail)
          .getDashboardData();
      }
      function render(data) {
        refresh.disabled = false;
        state.hidden = true;
        content.hidden = false;
        text("date", "Business date: " + data.businessDate);
        text(
          "refreshed",
          "Updated " + new Date(data.refreshedAt).toLocaleTimeString(),
        );
        ["expected", "actual", "variance", "quantity"].forEach(function (key) {
          text(key, number(data.totals[key]));
        });
        const variance = document.getElementById("variance");
        variance.className =
          "value " + (data.totals.variance < 0 ? "bad" : "good");
        document.getElementById("rows").innerHTML = data.sites.length
          ? data.sites
              .map(function (site) {
                return (
                  '<tr><td class="site">' +
                  escapeHtml(site.site) +
                  '</td><td class="number">' +
                  number(site.expected) +
                  '</td><td class="number">' +
                  number(site.actual) +
                  '</td><td class="number ' +
                  (site.variance < 0 ? "negative" : "positive") +
                  '">' +
                  number(site.variance) +
                  '</td><td class="number">' +
                  number(site.quantity) +
                  "</td><td>" +
                  escapeHtml(
                    site.capturedAt
                      ? new Date(site.capturedAt).toLocaleTimeString()
                      : "—",
                  ) +
                  "</td></tr>"
                );
              })
              .join("")
          : '<tr><td colspan="6">No records for this date.</td></tr>';
      }
      function fail(error) {
        refresh.disabled = false;
        content.hidden = true;
        state.hidden = false;
        state.className = "error";
        state.textContent =
          error && error.message ? error.message : "Dashboard unavailable.";
      }
      refresh.addEventListener("click", load);
      load();
    </script>
  </body>
</html>
