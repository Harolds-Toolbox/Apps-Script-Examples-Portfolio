<!doctype html>
<html lang="en">
  <head>
    <base target="_top" />
    <style>
      :root {
        --ink: #17202a;
        --muted: #667085;
        --line: #d0d5dd;
        --accent: #3538cd;
        --bg: #f6f7fb;
        font-family: Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
      }
      header {
        padding: 28px max(24px, calc((100% - 1180px) / 2));
        background: #1d2939;
        color: #fff;
      }
      h1 {
        margin: 0;
        font-size: 27px;
      }
      header p {
        margin: 6px 0 0;
        color: #d0d5dd;
      }
      main {
        max-width: 1180px;
        margin: 26px auto;
        padding: 0 24px;
      }
      .toolbar {
        display: grid;
        grid-template-columns: 1fr 260px;
        gap: 12px;
        margin-bottom: 18px;
      }
      input,
      select {
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        font: inherit;
      }
      .summary {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .pill {
        padding: 7px 10px;
        border-radius: 999px;
        background: #eef0ff;
        color: var(--accent);
        font-size: 13px;
        font-weight: 800;
      }
      .panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: auto;
        box-shadow: 0 12px 35px rgba(16, 24, 40, 0.06);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 760px;
      }
      th,
      td {
        padding: 12px 14px;
        border-bottom: 1px solid #eaecf0;
        text-align: left;
      }
      th {
        position: sticky;
        top: 0;
        background: #f8f9fc;
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
      }
      .path {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #344054;
      }
      .empty {
        padding: 40px;
        text-align: center;
        color: var(--muted);
      }
      @media (max-width: 650px) {
        .toolbar {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>API data catalogue</h1>
      <p>Search discovered endpoint fields and observed data types.</p>
    </header>
    <main>
      <div class="toolbar">
        <input
          id="search"
          type="search"
          placeholder="Search field path or example"
        /><select id="endpoint">
          <option value="">All endpoints</option>
        </select>
      </div>
      <div class="summary" id="summary"></div>
      <section class="panel">
        <table>
          <thead>
            <tr>
              <th>Endpoint</th>
              <th>Field path</th>
              <th>Types</th>
              <th>Nullable</th>
              <th>Example</th>
              <th>Occurrences</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" hidden>No matching fields.</div>
      </section>
    </main>
    <script>
      let data = { fields: [], endpoints: [], relationships: [] };
      const search = document.getElementById("search"),
        endpoint = document.getElementById("endpoint"),
        rows = document.getElementById("rows"),
        empty = document.getElementById("empty");
      function esc(value) {
        const node = document.createElement("span");
        node.textContent = value == null ? "" : String(value);
        return node.innerHTML;
      }
      function render() {
        const q = search.value.trim().toLowerCase(),
          selected = endpoint.value;
        const filtered = data.fields.filter(function (field) {
          return (
            (!selected || field.Endpoint === selected) &&
            (!q ||
              (
                field["Field Path"] +
                " " +
                field.Example +
                " " +
                field["Observed Types"]
              )
                .toLowerCase()
                .indexOf(q) !== -1)
          );
        });
        rows.innerHTML = filtered
          .map(function (field) {
            return (
              "<tr><td>" +
              esc(field.Endpoint) +
              '</td><td class="path">' +
              esc(field["Field Path"]) +
              "</td><td>" +
              esc(field["Observed Types"]) +
              "</td><td>" +
              esc(field.Nullable) +
              "</td><td>" +
              esc(field.Example) +
              "</td><td>" +
              esc(field.Occurrences) +
              "</td></tr>"
            );
          })
          .join("");
        empty.hidden = filtered.length > 0;
      }
      function load(result) {
        data = result;
        endpoint.innerHTML =
          '<option value="">All endpoints</option>' +
          data.endpoints
            .map(function (item) {
              return "<option>" + esc(item.Endpoint) + "</option>";
            })
            .join("");
        document.getElementById("summary").innerHTML =
          '<span class="pill">' +
          data.endpoints.length +
          ' endpoints</span><span class="pill">' +
          data.fields.length +
          ' fields</span><span class="pill">' +
          data.relationships.length +
          " possible relationships</span>";
        render();
      }
      search.addEventListener("input", render);
      endpoint.addEventListener("change", render);
      google.script.run
        .withSuccessHandler(load)
        .withFailureHandler(function (error) {
          document.querySelector(".panel").innerHTML =
            '<div class="empty">' +
            esc(
              error && error.message ? error.message : "Catalogue unavailable.",
            ) +
            "</div>";
        })
        .getApiCatalogueData();
    </script>
  </body>
</html>
