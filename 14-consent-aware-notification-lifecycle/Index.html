<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:15px system-ui;max-width:720px;margin:40px auto;padding:0 18px;color:#17202a}.recipient{display:flex;gap:10px;padding:9px;border-bottom:1px solid #e5e7eb}button{padding:10px 15px;border:0;border-radius:5px;background:#1769aa;color:white;margin-top:15px}#message{margin-top:15px}</style></head><body><h1 id="title">Notification preferences</h1><div id="content"></div><div id="message"></div><script>const token=<?!= JSON.stringify(token) ?>,view=<?!= JSON.stringify(view) ?>,content=document.getElementById('content'),message=document.getElementById('message');function fail(e){message.textContent=e.message}if(view==='review'){google.script.run.withSuccessHandler(data=>{document.getElementById('title').textContent='Review: '+data.title;content.innerHTML=data.recipients.map(r=>`<label class="recipient"><input type="checkbox" value="${escapeHtml(r.id)}" checked><span>${escapeHtml(r.name)} — ${escapeHtml(r.email)}</span></label>`).join('')+'<button onclick="approve()">Send to selected recipients</button>'}).withFailureHandler(fail).getNotificationReview(token)}else{content.innerHTML='<p>Use the button below to stop future notifications. The link is single-use and expires automatically.</p><button onclick="unsubscribe()">Unsubscribe</button>'}function approve(){const ids=[...document.querySelectorAll('input:checked')].map(x=>x.value);google.script.run.withSuccessHandler(r=>{content.innerHTML='';message.textContent=r.sent+' notification(s) sent.'}).withFailureHandler(fail).approveNotificationRecipients(token,ids)}function unsubscribe(){google.script.run.withSuccessHandler(r=>{content.innerHTML='';message.textContent=r.message}).withFailureHandler(fail).unsubscribeWithToken(token)}function escapeHtml(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
