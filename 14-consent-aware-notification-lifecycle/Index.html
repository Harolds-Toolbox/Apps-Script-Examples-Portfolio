<!doctype html>
<html>
  <head>
    <base target="_top" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body {
        font: 15px system-ui;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 18px;
        color: #17202a;
      }
      .recipient {
        display: flex;
        gap: 10px;
        padding: 9px;
        border-bottom: 1px solid #e5e7eb;
      }
      button {
        padding: 10px 15px;
        border: 0;
        border-radius: 5px;
        background: #1769aa;
        color: white;
        margin-top: 15px;
      }
      #message {
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <h1 id="title">Notification preferences</h1>
    <div id="content"></div>
    <div id="message"></div>
    <script>
      function decodeBase64Utf8(value) {
        const bytes = Uint8Array.from(atob(value), function (character) {
          return character.charCodeAt(0);
        });
        return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
      }
      const bootstrap = JSON.parse(
        decodeBase64Utf8("<?!= bootstrapBase64 ?>"),
      );
      const token = bootstrap.token;
      const view = bootstrap.view;
      const content = document.getElementById("content");
      const message = document.getElementById("message");

      function fail(error) {
        message.textContent = error.message;
      }

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, function (character) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[character];
        });
      }

      function renderReview(data) {
        document.getElementById("title").textContent = "Review: " + data.title;
        const recipients = data.recipients
          .map(function (recipient) {
            return `<label class="recipient"><input type="checkbox" value="${escapeHtml(recipient.id)}" checked><span>${escapeHtml(recipient.name)} — ${escapeHtml(recipient.email)}</span></label>`;
          })
          .join("");
        content.innerHTML = recipients + '<button onclick="approve()">Send to selected recipients</button>';
      }

      function approve() {
        const ids = Array.from(document.querySelectorAll("input:checked")).map(
          function (input) { return input.value; },
        );
        google.script.run
          .withSuccessHandler(function (result) {
            message.textContent =
              result.sent +
              " sent; " +
              result.declined +
              " declined; " +
              result.failed +
              " failed.";
            if (result.failed) {
              loadReview();
            } else {
              content.innerHTML = "";
            }
          })
          .withFailureHandler(fail)
          .approveNotificationRecipients(token, ids);
      }

      function unsubscribe() {
        google.script.run
          .withSuccessHandler(function (result) {
            content.innerHTML = "";
            message.textContent = result.message;
          })
          .withFailureHandler(fail)
          .unsubscribeWithToken(token);
      }

      function loadReview() {
        google.script.run
          .withSuccessHandler(renderReview)
          .withFailureHandler(fail)
          .getNotificationReview(token);
      }

      if (view === "review") {
        loadReview();
      } else {
        content.innerHTML = '<p>Use the button below to stop future notifications. The link is single-use and expires automatically.</p><button onclick="unsubscribe()">Unsubscribe</button>';
      }
    </script>
  </body>
</html>
